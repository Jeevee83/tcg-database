<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéShopify - Manager</title>
    <!-- Link corretto alla libreria Vue.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        [v-cloak] { display: none; }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <div id="app" v-cloak class="max-w-7xl mx-auto p-4 md:p-6">
        
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-6 rounded-xl shadow-sm gap-4">
            <h1 class="text-2xl font-bold text-blue-600">PokéShopify CSV Generator</h1>
            <div class="flex gap-4 w-full md:w-auto">
                <input v-model="searchQuery" type="text" placeholder="Search card..." class="border p-2 rounded-lg w-full md:w-64 shadow-sm focus:ring-2 focus:ring-blue-400 outline-none">
                <select v-model="selectedSet" @change="loadData" class="border p-2 rounded-lg bg-white shadow-sm">
                    <option value="base-set">Base Set</option>
                </select>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Card Grid -->
            <div class="lg:col-span-2">
                <div v-if="loading" class="text-center py-20 text-gray-500">Loading Database...</div>
                <div v-else class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4">
                    <div v-for="card in filteredCards" :key="card.sku" 
                         class="bg-white p-3 rounded-lg shadow hover:shadow-lg transition cursor-pointer border-2 border-transparent hover:border-blue-400 group"
                         @click="addToExport(card)">
                        <div class="relative overflow-hidden rounded-md mb-2 aspect-[3/4]">
                            <img :src="card.image_url" class="w-full h-full object-contain group-hover:scale-110 transition duration-300" loading="lazy">
                        </div>
                        <p class="text-[10px] text-gray-400 uppercase font-bold">{{ card.number }}</p>
                        <p class="font-bold text-sm truncate text-gray-800">{{ card.name }}</p>
                        <p class="text-xs text-blue-500 font-medium">{{ card.rarity }}</p>
                        <button class="mt-2 w-full bg-blue-50 text-blue-600 text-[10px] font-bold py-1 rounded border border-blue-100 group-hover:bg-blue-600 group-hover:text-white transition">
                            + ADD TO LIST
                        </button>
                    </div>
                </div>
            </div>

            <!-- Export List -->
            <div class="bg-white p-6 rounded-xl shadow-lg sticky top-6 h-fit max-h-[90vh] flex flex-col border border-gray-200">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-gray-800">Export List ({{ exportList.length }})</h2>
                    <button @click="exportCSV" 
                            class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-green-700 shadow-md transition disabled:opacity-30 disabled:cursor-not-allowed" 
                            :disabled="exportList.length === 0">
                        Download CSV
                    </button>
                </div>

                <div class="space-y-4 overflow-y-auto pr-2 flex-grow">
                    <div v-for="(item, index) in exportList" :key="index" class="bg-gray-50 p-3 rounded-lg border border-gray-100 relative group">
                        <button @click="removeFromExport(index)" class="absolute top-2 right-2 text-gray-300 hover:text-red-500 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                        
                        <div class="pr-6">
                            <p class="font-bold text-xs text-blue-800 mb-2 truncate">{{ item.name }}</p>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="text-[9px] uppercase font-black text-gray-400 block mb-1">Condition</label>
                                    <select v-model="item.selectedCondition" class="w-full border border-gray-200 p-1 text-[11px] rounded bg-white">
                                        <option>MINT</option>
                                        <option>Near Mint</option>
                                        <option>Lightly Played</option>
                                        <option>Played</option>
                                        <option>Poor</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="text-[9px] uppercase font-black text-gray-400 block mb-1">Price (€)</label>
                                    <input v-model="item.price" type="number" step="0.01" class="w-full border border-gray-200 p-1 text-[11px] rounded bg-white">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div v-if="exportList.length === 0" class="text-center text-gray-300 py-20 italic flex flex-col items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                    Select cards from the left
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    cards: [],
                    exportList: [],
                    searchQuery: '',
                    selectedSet: 'base-set',
                    loading: true
                }
            },
            computed: {
                filteredCards() {
                    if (!this.cards) return [];
                    return this.cards.filter(card => 
                        card.name.toLowerCase().includes(this.searchQuery.toLowerCase())
                    );
                }
            },
            mounted() {
                this.loadData();
            },
            methods: {
                async loadData() {
                    this.loading = true;
                    // URL aggiornato al tuo percorso data/base-set/database.json
                    const url = `https://raw.githubusercontent.com/Jeevee83/tcg-database/main/data/${this.selectedSet}/database.json`;
                    try {
                        const response = await fetch(url);
                        if (!response.ok) throw new Error("File not found");
                        this.cards = await response.json();
                    } catch (error) {
                        console.error("Fetch error:", error);
                        alert("ERRORE: Non riesco a leggere il file database.json. Controlla che sia caricato in data/base-set/database.json");
                    } finally {
                        this.loading = false;
                    }
                },
                addToExport(card) {
                    this.exportList.push({
                        ...card,
                        selectedCondition: 'Near Mint',
                        price: 1.00
                    });
                },
                removeFromExport(index) {
                    this.exportList.splice(index, 1);
                },
                exportCSV() {
                    // Header CSV ottimizzato per Shopify
                    let csvContent = "Handle,Title,Body (HTML),Vendor,Type,Tags,Published,Option1 Name,Option1 Value,Variant SKU,Variant Grams,Variant Inventory Tracker,Variant Inventory Qty,Variant Inventory Policy,Variant Fulfillment Service,Variant Price,Variant Compare At Price,Image Src\n";

                    this.exportList.forEach(item => {
                        // Creiamo un Handle unico basato su SKU e Condizione
                        const condClean = item.selectedCondition.toLowerCase().replace(/\s+/g, '-');
                        const handle = `${item.sku}-${condClean}`;
                        const title = `Pokemon ${item.name} - ${item.number} (${item.selectedCondition})`;
                        const tags = `Pokemon, ${item.category}, Base Set, ${item.rarity}`;
                        
                        // Formattazione riga CSV
                        const row = [
                            `"${handle}"`,
                            `"${title}"`,
                            `""`, // Body
                            `"Jeevee TCG"`, // Vendor (cambialo pure qui)
                            `"Single Card"`,
                            `"${tags}"`,
                            `true`,
                            `"Condition"`,
                            `"${item.selectedCondition}"`,
                            `"${item.sku}"`,
                            `5`, // Grammi
                            `"shopify"`,
                            `1`, // Qty
                            `"deny"`,
                            `"manual"`,
                            item.price,
                            `""`, // Compare at price
                            `"${item.image_url}"`
                        ];
                        csvContent += row.join(",") + "\n";
                    });

                    // Download automatico
                    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement("a");
                    const url = URL.createObjectURL(blob);
                    link.setAttribute("href", url);
                    link.setAttribute("download", `shopify_import_${new Date().toISOString().slice(0,10)}.csv`);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
