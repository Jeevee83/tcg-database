<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardex TCG Database - Manager</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>[v-cloak] { display: none; }</style>
</head>
<body class="bg-gray-100 font-sans text-gray-900">
    <div id="app" v-cloak class="max-w-7xl mx-auto p-4 md:p-6">
        
        <!-- HEADER -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 bg-white p-6 rounded-2xl shadow-sm gap-6 border-b-4 border-blue-600">
            <div class="text-center md:text-left">
                <h1 class="text-4xl font-black text-gray-900 tracking-tighter uppercase">Cardex TCG Database</h1>
                <h2 class="text-lg font-bold text-blue-600 leading-tight uppercase tracking-tight">CSV export for shopify</h2>
                <p class="text-[10px] text-gray-400 font-medium tracking-widest mt-1">by Jeevee83</p>
            </div>
            <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                <!-- Search -->
                <div class="relative flex-grow">
                    <input v-model="searchQuery" type="text" placeholder="Search name or artist..." class="w-full md:w-64 border-2 border-gray-100 p-3 rounded-xl shadow-inner focus:border-blue-400 outline-none transition pl-10 text-sm font-bold">
                    <svg class="w-5 h-5 absolute left-3 top-3.5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <!-- Set Selector (JUNGLE ADDED) -->
                <select v-model="selectedSet" @change="loadData" class="border-2 border-gray-100 p-3 rounded-xl bg-white shadow-inner font-black text-gray-600 cursor-pointer focus:border-blue-400 outline-none text-sm">
                    <option value="base-set">Base Set (102)</option>
                    <option value="jungle">Jungle (64)</option>
                </select>
            </div>
        </header>

        <!-- CATEGORY FILTERS -->
        <div class="flex flex-wrap gap-2 mb-8">
            <button v-for="cat in ['All', 'Pokémon', 'Trainer', 'Energy']" :key="cat"
                    @click="activeCategory = cat"
                    :class="['px-6 py-2 rounded-full font-black text-xs uppercase tracking-widest transition-all shadow-sm border-2', 
                    activeCategory === cat ? 'bg-blue-600 border-blue-600 text-white scale-105' : 'bg-white border-white text-gray-400 hover:border-blue-200']">
                {{ cat }}
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Card Grid -->
            <div class="lg:col-span-2">
                <div v-if="loading" class="text-center py-20">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent"></div>
                    <p class="mt-4 font-black text-gray-300 uppercase tracking-widest">Accessing Database...</p>
                </div>
                <div v-else class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4">
                    <div v-for="card in filteredCards" :key="card.sku" 
                         class="bg-white p-3 rounded-2xl shadow hover:shadow-2xl transition-all duration-300 cursor-pointer border-2 border-transparent hover:border-blue-500 group relative"
                         @click="addToExport(card)">
                        
                        <div class="relative overflow-hidden rounded-xl mb-3 aspect-[3/4] bg-gray-50 border border-gray-100">
                            <img :src="card.image_url" class="w-full h-full object-contain group-hover:scale-105 transition duration-500" loading="lazy">
                        </div>

                        <div class="px-1 text-center">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[9px] font-black text-gray-300">{{ card.number }}</span>
                                <span class="text-[8px] bg-blue-50 text-blue-500 px-2 py-0.5 rounded-full font-black uppercase tracking-tighter">{{ card.category }}</span>
                            </div>
                            <p class="font-black text-xs truncate text-gray-800 uppercase tracking-tighter mb-0.5">{{ card.name }}</p>
                            <p class="text-[9px] text-gray-400 font-bold italic truncate">{{ card.illustrator }}</p>
                            <p class="text-[9px] text-blue-400 font-black uppercase mt-1">{{ card.rarity }}</p>
                        </div>
                        <div class="absolute inset-0 bg-blue-600/10 opacity-0 group-hover:opacity-100 transition-opacity rounded-2xl flex items-center justify-center">
                            <span class="bg-blue-600 text-white px-4 py-1.5 rounded-full text-[10px] font-black shadow-xl translate-y-4 group-hover:translate-y-0 transition-transform tracking-widest uppercase">+ ADD</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Export List -->
            <div class="bg-white p-6 rounded-3xl shadow-xl sticky top-6 h-fit max-h-[90vh] flex flex-col border border-gray-100">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h2 class="text-xl font-black text-gray-800 uppercase tracking-tighter">Export Queue</h2>
                        <div class="flex gap-2 items-center mt-1">
                            <p class="text-[10px] font-black text-blue-500 uppercase tracking-widest">{{ exportList.length }} items</p>
                            <button v-if="exportList.length > 0" @click="clearQueue" class="text-[9px] font-black text-red-400 hover:text-red-600 uppercase underline transition">Clear All</button>
                        </div>
                    </div>
                    <button @click="exportCSV" class="bg-green-600 text-white px-5 py-3 rounded-xl font-black hover:bg-green-700 shadow-lg transition active:scale-95 disabled:opacity-20 disabled:grayscale" :disabled="exportList.length === 0">
                        GET CSV
                    </button>
                </div>

                <div class="space-y-3 overflow-y-auto pr-2 flex-grow">
                    <div v-for="(item, index) in exportList" :key="index" class="bg-gray-50 p-4 rounded-2xl border border-gray-200 relative group animate-in slide-in-from-right duration-300">
                        <button @click="removeFromExport(index)" class="absolute top-3 right-3 text-gray-300 hover:text-red-500 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path d="M6 18L18 6M6 6l12 12" /></svg>
                        </button>
                        
                        <p class="font-black text-[11px] text-blue-900 mb-3 uppercase tracking-tight">{{ item.name }} <span class="text-gray-400 font-bold ml-1">#{{ item.number }}</span></p>
                        
                        <div class="space-y-3">
                            <div>
                                <label class="text-[9px] font-black text-gray-400 uppercase block mb-1">Edition</label>
                                <select v-model="item.selectedVariant" class="w-full border-2 border-gray-200 p-2 text-[10px] rounded-xl bg-white font-bold text-blue-600 outline-none">
                                    <option>Unlimited</option><option>1st Edition</option><option>Shadowless</option>
                                </select>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="text-[9px] font-black text-gray-400 uppercase block mb-1">Condition</label>
                                    <select v-model="item.selectedCondition" class="w-full border-2 border-gray-200 p-2 text-[10px] rounded-xl bg-white font-bold outline-none">
                                        <option>MINT</option><option>Near Mint</option><option>Lightly Played</option><option>Played</option><option>Poor</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="text-[9px] font-black text-gray-400 uppercase block mb-1">Price (CHF)</label>
                                    <input v-model="item.price" type="number" step="0.01" class="w-full border-2 border-gray-200 p-2 text-[10px] rounded-xl bg-white font-black text-green-700 outline-none focus:border-green-500">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    cards: [],
                    exportList: [],
                    searchQuery: '',
                    selectedSet: 'base-set',
                    activeCategory: 'All',
                    loading: true
                }
            },
            watch: {
                exportList: {
                    handler(newList) { localStorage.setItem('cardex_export_queue', JSON.stringify(newList)); },
                    deep: true
                }
            },
            computed: {
                filteredCards() {
                    return this.cards.filter(c => {
                        const matchesSearch = c.name.toLowerCase().includes(this.searchQuery.toLowerCase()) || 
                                              c.illustrator.toLowerCase().includes(this.searchQuery.toLowerCase());
                        const matchesCategory = this.activeCategory === 'All' || c.category === this.activeCategory;
                        return matchesSearch && matchesCategory;
                    });
                }
            },
            mounted() { 
                this.loadData();
                const savedQueue = localStorage.getItem('cardex_export_queue');
                if (savedQueue) this.exportList = JSON.parse(savedQueue);
            },
            methods: {
                async loadData() {
                    this.loading = true;
                    const url = `https://raw.githubusercontent.com/Jeevee83/tcg-database/main/data/${this.selectedSet}/database.json`;
                    try {
                        const response = await fetch(url);
                        this.cards = await response.json();
                    } catch (error) { console.error(error); } finally { this.loading = false; }
                },
                addToExport(card) {
                    this.exportList.unshift({ ...card, selectedCondition: 'Near Mint', selectedVariant: 'Unlimited', price: 1.00 });
                },
                removeFromExport(index) { this.exportList.splice(index, 1); },
                clearQueue() { if(confirm("Clear all items?")) this.exportList = []; },
                exportCSV() {
                    let csv = "Handle,Title,Body (HTML),Vendor,Type,Tags,Published,Option1 Name,Option1 Value,Option2 Name,Option2 Value,Variant SKU,Variant Grams,Variant Inventory Tracker,Variant Inventory Qty,Variant Inventory Policy,Variant Fulfillment Service,Variant Price,Image Src\n";
                    
                    const vendor = (this.selectedSet === 'base-set' || this.selectedSet === 'jungle') ? "Wizards of the Coast" : "The Pokémon Company";
                    const setName = this.selectedSet === 'base-set' ? "Base Set" : "Jungle";

                    this.exportList.forEach(item => {
                        const varClean = item.selectedVariant.toLowerCase().replace(/\s+/g, '-');
                        const condClean = item.selectedCondition.toLowerCase().replace(/\s+/g, '-');
                        const handle = `${item.sku}-${varClean}-${condClean}`;
                        const title = `Pokemon ${item.name} - ${item.number} (${item.selectedVariant}) [${item.selectedCondition}]`;
                        const cleanIllus = item.illustrator.replace(/^Illus\.\s+/i, '');

                        const tags = `"Pokemon, ${item.category}, ${setName}, ${item.rarity}, ${cleanIllus}, ${item.selectedVariant}, ${item.selectedCondition}"`;
                        
                        csv += `"${handle}","${title}","","${vendor}","Single Card Raw",${tags},true,"Edition","${item.selectedVariant}","Condition","${item.selectedCondition}","${handle}",5,"shopify",1,"deny","manual",${item.price},"${item.image_url}"\n`;
                    });
                    
                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const link = document.body.appendChild(document.createElement("a"));
                    link.href = URL.createObjectURL(blob);
                    link.download = `cardex_${this.selectedSet}_shopify.csv`;
                    link.click();
                    document.body.removeChild(link);
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
