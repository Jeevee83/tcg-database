<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéShopify CHF - Manager</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>[v-cloak] { display: none; }</style>
</head>
<body class="bg-gray-100 font-sans">
    <div id="app" v-cloak class="max-w-7xl mx-auto p-4 md:p-6">
        
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-6 rounded-xl shadow-sm gap-4 border-b-4 border-blue-500">
            <div>
                <h1 class="text-2xl font-bold text-gray-800 tracking-tight">PokéShopify <span class="text-blue-600 text-sm">CHF Edition</span></h1>
            </div>
            <div class="flex gap-4 w-full md:w-auto">
                <input v-model="searchQuery" type="text" placeholder="Search card..." class="border p-2 rounded-lg w-full md:w-64 shadow-sm focus:ring-2 focus:ring-blue-400 outline-none">
                <select v-model="selectedSet" @change="loadData" class="border p-2 rounded-lg bg-white shadow-sm font-bold text-gray-600">
                    <option value="base-set">Base Set (102)</option>
                </select>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Card Grid -->
            <div class="lg:col-span-2">
                <div v-if="loading" class="text-center py-20 text-gray-500 font-bold animate-pulse">LOADING DATABASE...</div>
                <div v-else class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4">
                    <div v-for="card in filteredCards" :key="card.sku" 
                         class="bg-white p-3 rounded-lg shadow hover:shadow-lg transition cursor-pointer border-2 border-transparent hover:border-blue-400 group"
                         @click="addToExport(card)">
                        <div class="relative overflow-hidden rounded-md mb-2 aspect-[3/4] bg-gray-50">
                            <img :src="card.image_url" class="w-full h-full object-contain group-hover:scale-105 transition duration-300" loading="lazy">
                        </div>
                        <div class="flex justify-between items-start">
                            <p class="text-[9px] text-gray-400 font-black">{{ card.number }}</p>
                            <span class="text-[9px] bg-blue-100 text-blue-700 px-1 rounded font-bold">{{ card.category }}</span>
                        </div>
                        <p class="font-bold text-sm truncate text-gray-800">{{ card.name }}</p>
                        <p class="text-[10px] text-blue-500 font-medium">{{ card.rarity }}</p>
                        <button class="mt-2 w-full bg-blue-600 text-white text-[10px] font-bold py-1.5 rounded shadow-sm opacity-0 group-hover:opacity-100 transition">
                            + ADD TO LIST
                        </button>
                    </div>
                </div>
            </div>

            <!-- Export List -->
            <div class="bg-white p-6 rounded-xl shadow-lg sticky top-6 h-fit max-h-[90vh] flex flex-col border border-gray-200">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-gray-800">Export ({{ exportList.length }})</h2>
                    <button @click="exportCSV" 
                            class="bg-green-600 text-white px-5 py-2.5 rounded-lg font-black hover:bg-green-700 shadow-md transition disabled:opacity-20" 
                            :disabled="exportList.length === 0">
                        GENERATE CSV
                    </button>
                </div>

                <div class="space-y-4 overflow-y-auto pr-2 flex-grow">
                    <div v-for="(item, index) in exportList" :key="index" class="bg-gray-50 p-4 rounded-xl border border-gray-200 relative">
                        <button @click="removeFromExport(index)" class="absolute top-2 right-2 text-gray-400 hover:text-red-500">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor font-bold"><path d="M6 18L18 6M6 6l12 12" /></svg>
                        </button>
                        
                        <p class="font-black text-xs text-blue-900 mb-3">{{ item.name }} <span class="text-gray-400 font-normal">#{{ item.number }}</span></p>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-[10px] font-bold text-gray-500 uppercase block mb-1">Condition</label>
                                <select v-model="item.selectedCondition" class="w-full border border-gray-300 p-1.5 text-xs rounded-lg bg-white">
                                    <option>MINT</option>
                                    <option>Near Mint</option>
                                    <option>Lightly Played</option>
                                    <option>Played</option>
                                    <option>Poor</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-gray-500 uppercase block mb-1">Price (CHF)</label>
                                <input v-model="item.price" type="number" step="0.01" class="w-full border border-gray-300 p-1.5 text-xs rounded-lg bg-white font-bold text-green-700">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    cards: [],
                    exportList: [],
                    searchQuery: '',
                    selectedSet: 'base-set',
                    loading: true
                }
            },
            computed: {
                filteredCards() {
                    return this.cards.filter(c => c.name.toLowerCase().includes(this.searchQuery.toLowerCase()));
                }
            },
            mounted() { this.loadData(); },
            methods: {
                async loadData() {
                    this.loading = true;
                    const url = `https://raw.githubusercontent.com/Jeevee83/tcg-database/main/data/${this.selectedSet}/database.json`;
                    try {
                        const response = await fetch(url);
                        this.cards = await response.json();
                    } catch (error) {
                        alert("Error loading JSON");
                    } finally { this.loading = false; }
                },
                addToExport(card) {
                    this.exportList.push({ ...card, selectedCondition: 'Near Mint', price: 5.00 });
                },
                removeFromExport(index) { this.exportList.splice(index, 1); },
                exportCSV() {
                    let csv = "Handle,Title,Body (HTML),Vendor,Type,Tags,Published,Option1 Name,Option1 Value,Variant SKU,Variant Grams,Variant Inventory Tracker,Variant Inventory Qty,Variant Inventory Policy,Variant Fulfillment Service,Variant Price,Image Src\n";
                    this.exportList.forEach(item => {
                        const handle = `${item.sku}-${item.selectedCondition.toLowerCase().replace(/\s+/g, '-')}`;
                        const title = `Pokemon ${item.name} - ${item.number} (${item.selectedCondition})`;
                        const tags = `Pokemon, ${item.category}, Base Set, ${item.rarity}`;
                        csv += `"${handle}","${title}","","Jeevee TCG","Single Card","${tags}",true,"Condition","${item.selectedCondition}","${item.sku}",5,"shopify",1,"deny","manual",${item.price},"${item.image_url}"\n`;
                    });
                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement("a");
                    link.href = URL.createObjectURL(blob);
                    link.download = `shopify_chf_import.csv`;
                    link.click();
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
